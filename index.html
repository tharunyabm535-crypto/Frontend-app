<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Weather Dashboard</h1>
        <p>Search weather details by city</p>
    </header>
    <main>
            <h2>Search City</h2>
            <form id="weatherForm">
                <label for="cityInput">
                    Enter City Name
                </label>
                <div class="search-row">
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name"
                        required
                    >
                    <button type="submit">Search</button>
                </div>
            </form>
        </section>
        <section id="weatherCard" class="weather-card">
            <h2 id="cityName">City</h2>
            <div class="temperature">
                <span id="temperature">--</span> °C
            </div>
            <p id="condition">
                Weather Condition
            </p>
            <div class="weather-details">
                <div class="detail">
                    <strong id="humidity">--%</strong>
                    <small>Humidity</small>
                </div>
                <div class="detail">
                    <strong id="wind">-- km/h</strong>
                    <small>Wind</small>
                </div>
            </div>
        </section>
        <section class="history">
            <div class="history-title">
                <h2>Search History</h2>
                <button id="clearHistory">
                    Clear History
                </button>
            </div>
            <ul id="historyList">
                <li>No searches yet.</li>
            </ul>
        </section>
    </main>
</body>
</html>
